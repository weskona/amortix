name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: Build and attach release ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set version from tag
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_ENV"
          jq --arg version "$version" '.version = $version' \
            custom_components/amortix/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/amortix/manifest.json
          echo "manifest version set to $version"

      - name: Commit version bump back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/amortix/manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json already at ${version}, nothing to commit"
          else
            git commit -m "Bump manifest.json version to ${version} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create ZIP
        run: |
          cd custom_components/amortix
          zip -r amortix.zip ./*

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: custom_components/amortix/amortix.zip
