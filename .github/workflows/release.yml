name: Release

on:
  # Release im GitHub-UI veröffentlichen ...
  release:
    types:
      - published
  # ... oder einen Tag "vX.Y.Z" pushen (legt das Release automatisch an)
  push:
    tags:
      - "v*"
  # ... oder manuell starten (Actions -> Release -> Run workflow): legt Tag
  # und Release für den angegebenen Tag auf dem aktuellen main an
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, z. B. v1.1.0"
        required: true
        type: string

permissions:
  contents: write

# Ein neues Release erzeugt je nach Weg ein Release- und ein Tag-Event;
# pro Tag nur ein Lauf gleichzeitig.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and attach release ZIP
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set version from tag
        run: |
          version="${TAG}"
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_ENV"
          jq --arg version "$version" '.version = $version' \
            custom_components/amortix/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/amortix/manifest.json
          echo "manifest version set to $version"

      - name: Commit version bump back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/amortix/manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json already at ${version}, nothing to commit"
          else
            git commit -m "Bump manifest.json version to ${version} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create ZIP
        run: |
          cd custom_components/amortix
          zip -r amortix.zip ./*

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          # Section "## [<version>]"; falls back to "## [Unreleased]" if the
          # version has no section yet. No section found -> keep the notes
          # that were written manually on the release.
          extract() {
            awk -v h="## [$1]" '
              index($0, h) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found && /^\[[^]]+\]: / { exit }
              found { print }
            ' CHANGELOG.md | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba' -e '}'
          }
          notes="$(extract "${version}")"
          if [ -z "$notes" ]; then
            notes="$(extract "Unreleased")"
          fi
          if [ -n "$notes" ]; then
            printf '%s\n' "$notes" > release_notes.md
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changelog entry found, keeping existing release notes"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          files: custom_components/amortix/amortix.zip
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          body_path: ${{ steps.notes.outputs.found == 'true' && 'release_notes.md' || '' }}
